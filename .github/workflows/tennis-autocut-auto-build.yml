name: Tennis AutoCut Auto-first APK

on:
  push:
    branches: [tennis-autocut-auto-first]
    paths:
      - 'projects/tennis-autocut-auto/**'
      - '.github/workflows/tennis-autocut-auto-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test
        run: gradle -p projects/tennis-autocut-auto :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-autocut-auto-first-debug
          path: projects/tennis-autocut-auto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
